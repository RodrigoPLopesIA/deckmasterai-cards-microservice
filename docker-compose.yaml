services:
  database:
    image: mongo:latest
    container_name: deckmasterai_database
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: deckmasterai
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - ./data:/data/db
  minio:
    image: minio/minio:latest
    container_name: deckmasterai_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

volumes:
  data: